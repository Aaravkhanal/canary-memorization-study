# Pre-registered canary bank. Locked once scripts/prepare_canary_corpus.py has generated
# configs/canary_assignment.json from this file: the script refuses to regenerate the assignment file if it
# already exists, so which template stories carry which canary cannot silently change between runs. If this
# file needs a real change after that point, delete canary_assignment.json deliberately and say so, don't
# edit around it.
#
# Two canary types (Carlini et al. 2019 "Secret Sharer" style):
#   character     — a fixed name + trait pairing, inserted as an introductory sentence before the story's own text.
#   plot_fragment — a fixed structural phrase, inserted as a mid-story clause, so surrounding context still varies.
#
# Frequency is a property of the CORPUS VARIANT, not of an individual canary: at frequency F, every inserted
# canary below appears in exactly F template stories (the brief's "train one model per canary-frequency
# combination", not the cheaper mixed-frequency variant noted in README.md).

seed: 20260927
base_corpus: data/raw/base.txt              # symlink to aarav-lm's 60 MB TinyStories slice, 73,139 stories
frequencies: [1, 10, 50, 100, 500]
insertion_pool_size_per_canary: 500          # must be >= max(frequencies); nested (freq-F pool is the first F of this)

canaries:
  character:
    - id: char_pip
      text: "Pip the fox, who was always hungry"
      near_duplicate: "Pip the fox, who was constantly hungry"
    - id: char_nira
      text: "Nira the owl, who loved rainy nights"
      near_duplicate: "Nira the owl, who adored rainy nights"
    - id: char_boro
      text: "Boro the bear, who never told a lie"
      near_duplicate: "Boro the bear, who never told a fib"
    - id: char_suri
      text: "Suri the mouse, who dreamed of the sea"
      near_duplicate: "Suri the mouse, who dreamed about the sea"

  plot_fragment:
    - id: plot_key
      text: "then found a shiny key under the old oak tree"
      near_duplicate: "then discovered a shiny key beneath the old oak tree"
    - id: plot_song
      text: "and heard a strange song coming from the well"
      near_duplicate: "and heard a strange tune coming from the well"
    - id: plot_lantern
      text: "before the little lantern flickered three times"
      near_duplicate: "before the small lantern flickered three times"
    - id: plot_voice
      text: "until a soft voice whispered from behind the curtain"
      near_duplicate: "until a gentle voice whispered from behind the curtain"

# Never inserted into any training corpus. Used only at evaluation time as a zero-exposure baseline for the
# exposure metric and extraction rate (Phase 4) — a canary that was never seen should rank and extract like any
# other plausible-but-unseen phrase, not like the inserted ones.
unseen_controls:
  character:
    - id: ctrl_char_olen
      text: "Olen the badger, who counted every star"
    - id: ctrl_char_teva
      text: "Teva the hedgehog, who feared loud thunder"
  plot_fragment:
    - id: ctrl_plot_bell
      text: "and rang the little bell hidden in the barn"
    - id: ctrl_plot_map
      text: "then unfolded a torn map left by the river"

# Phase 4 metadata (additive: does not change the canary identities, insertion behaviour or frequencies locked
# above, which are unchanged from Phase 1). For each canary, `swap_target` is the exact substring that carries
# its "identity" and `alt_pool` is a fixed set of plausible substitutes used to build the reference set for the
# exposure metric (Carlini et al. 2019): rank the true canary's log-probability against these alternatives,
# everything else in the sentence held fixed, so the metric isolates whether the model specifically expects the
# true identity in that slot rather than just any plausible one.
#
# Widened from 8 (character) / 4 (plot fragment) alternatives after the freq_0 zero-exposure control (a real
# same-recipe baseline, not a mismatched-architecture stand-in) showed the OLD, narrower pools saturating the
# metric's ceiling by chance alone: char_pip and three of four plot fragments hit the maximum possible exposure
# in BOTH the freq_0 control (zero insertions) and the freq_1 result, i.e. zero measurable lift -- the metric
# had no headroom left to detect memorization for those canaries at this frequency. See PHASE4_NOTES.md. The
# first 8 character / 4 plot-fragment entries below are unchanged (so the already-scored freq_0/freq_1 results
# stay comparable once recomputed on this file); the rest are new, chosen the same way (plausible, distinct
# from every real/control name or phrase above).
character_alt_pool: [Zeb, Dara, Omi, Kalo, Fenn, Yara, Doro, Mira, Wren, Talo, Bexi, Orin, Fira, Lomo, Nell, Saka, Vello, Iris, Tuko]   # shared across character canaries; excludes every real/control name above

plot_fragment_swap:
  plot_key:
    swap_target: "a shiny key"
    alt_pool: ["a rusty coin", "a broken flute", "a red ribbon", "a folded letter", "a wooden whistle", "a silver locket", "a cracked mirror", "a woven basket", "a tiny compass"]
  plot_song:
    swap_target: "a strange song"
    alt_pool: ["a soft whistle", "a distant drum", "a quiet hum", "a low chime", "a gentle bell", "a faint whisper", "a merry tune", "a soft rustle", "a warm melody"]
  plot_lantern:
    swap_target: "the little lantern"
    alt_pool: ["the wooden gate", "the garden fence", "the old well cover", "the barn door", "the stone bridge", "the tall windmill", "the little birdhouse", "the mossy rock", "the wooden bench"]
  plot_voice:
    swap_target: "a soft voice"
    alt_pool: ["a tiny bell", "a paper note", "a warm glow", "a cold breeze", "a soft giggle", "a low hum", "a faint knock", "a gentle nudge", "a quiet sigh"]
  # unseen controls need the same swap metadata as the inserted canaries, or their exposure can't be computed at
  # all -- an earlier version of this file omitted these two and the sanity check silently showed "n/a" for both,
  # which looks like the metric working when it's really just missing data. Never seen in training either way.
  ctrl_plot_bell:
    swap_target: "the little bell"
    alt_pool: ["the wooden gate", "the garden fence", "the old well cover", "the barn door", "the stone bridge", "the tall windmill", "the little birdhouse", "the mossy rock", "the wooden bench"]
  ctrl_plot_map:
    swap_target: "a torn map"
    alt_pool: ["a rusty coin", "a broken flute", "a red ribbon", "a folded letter", "a wooden whistle", "a silver locket", "a cracked mirror", "a woven basket", "a tiny compass"]

# Phase 5 metadata (additive, same principle as the Phase 4 block above): pre-registered novel settings the
# recombination test places each canary's identity into. Chosen to be implausible in an ordinary TinyStories
# sentence, so a story that genuinely uses one is evidence of following the PROMPT, not of reproducing a training
# story (which would have had an ordinary, everyday setting).
novel_settings:
  - "a pirate ship sailing a stormy sea"
  - "the surface of the moon"
  - "a candy castle made of gumdrops"
  - "a hidden cave full of glowing crystals"
