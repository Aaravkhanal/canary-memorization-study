name: variant_b_mha_freq500
description: 'Canary study: variant_b_mha architecture, canary frequency 500. attention
  only: multi-head (every head has its own K/V) instead of grouped-query. n_layer
  dropped from 8 to 7 to compensate (n_kv_head=6 at n_layer=8 would be +11.1% params;
  at n_layer=7 it is -1.4%, the closest clean-integer match).'
model_preset: small
model_overrides:
  n_kv_head: 6
  n_layer: 7
tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: /Users/aaravkhanal/Desktop/myllm/aarav-lm/artifacts/tokenizer_tinystories_v2
  train_files: []
data:
  sources:
  - /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_500/corpus.txt
  format: txt
  doc_separator: <|endoftext|>
  out_dir: /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_500/tokenized
  val_fraction: 0.01
  test_fraction: 0.01
  min_chars: 20
  max_chars: 20000
  dedup: false
  seed: 20260927
train:
  seed: 20260927
  device: auto
  precision: fp32
  max_steps: 6000
  batch_size: 1
  grad_accum: 16
  eval_batch_size: 4
  lr: 0.0008
  min_lr_ratio: 0.1
  warmup_steps: 150
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 50
  log_interval: 25
  ckpt_interval: 500
  keep_last: 2
