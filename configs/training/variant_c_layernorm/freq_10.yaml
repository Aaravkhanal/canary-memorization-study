name: variant_c_layernorm_freq10
description: 'Canary study: variant_c_layernorm architecture, canary frequency 10.
  normalisation only: LayerNorm instead of RMSNorm. Exact parameter match (both are
  scale-only with bias=False).'
model_preset: small
model_overrides:
  norm_type: layernorm
tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: /Users/aaravkhanal/Desktop/myllm/aarav-lm/artifacts/tokenizer_tinystories_v2
  train_files: []
data:
  sources:
  - /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_10/corpus.txt
  format: txt
  doc_separator: <|endoftext|>
  out_dir: /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_10/tokenized_variant_c_layernorm
  val_fraction: 0.01
  test_fraction: 0.01
  min_chars: 20
  max_chars: 20000
  dedup: false
  seed: 20260927
train:
  seed: 20260927
  device: auto
  precision: fp32
  max_steps: 6000
  batch_size: 1
  grad_accum: 16
  eval_batch_size: 4
  lr: 0.0008
  min_lr_ratio: 0.1
  warmup_steps: 150
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 50
  log_interval: 25
  ckpt_interval: 500
  keep_last: 2
