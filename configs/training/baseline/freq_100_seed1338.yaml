# Second seed of baseline/freq_100. Only train.seed differs from freq_100.yaml; data.seed remains unchanged so
# corpus construction and canary insertion are byte-identical to the original run.
name: baseline_freq100_seed1338
description: 'Second seed of frequency 100, testing whether the high-frequency exposure ceiling replicates.'
model_preset: small
model_overrides: {}
tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: /Users/aaravkhanal/Desktop/myllm/aarav-lm/artifacts/tokenizer_tinystories_v2
  train_files: []
data:
  sources:
  - /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_100/corpus.txt
  format: txt
  doc_separator: <|endoftext|>
  out_dir: /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_100/tokenized
  val_fraction: 0.01
  test_fraction: 0.01
  min_chars: 20
  max_chars: 20000
  dedup: false
  seed: 20260927
train:
  seed: 1338
  device: auto
  precision: fp32
  max_steps: 6000
  batch_size: 1
  grad_accum: 16
  eval_batch_size: 4
  lr: 0.0008
  min_lr_ratio: 0.1
  warmup_steps: 150
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 50
  log_interval: 25
  ckpt_interval: 500
  keep_last: 2
