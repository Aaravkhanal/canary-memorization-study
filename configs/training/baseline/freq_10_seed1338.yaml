# Second seed of baseline/freq_10, continuing the same-condition noise measurement started at freq_0/freq_1
# (train.seed 1338, data.seed unchanged -- corpus construction and canary insertion byte-identical to the original
# run). freq_10 is the next-most-informative frequency to seed-replicate: PHASE4_NOTES.md's original frequency-10
# lifts for char_nira (+2.170) and char_suri (+1.459) now sit inside or at the edge of the revised ±2.459
# same-condition noise band (measured at freq_0/1) and are currently only "plausible, not established" -- this
# settles whether they survive a real second seed at their own frequency, rather than borrowing the noise estimate
# from a different frequency.
name: baseline_freq10_seed1338
description: 'Second seed of frequency 10, to settle whether the borderline char_nira/char_suri lifts survive a real seed replicate.'
model_preset: small
model_overrides: {}
tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: /Users/aaravkhanal/Desktop/myllm/aarav-lm/artifacts/tokenizer_tinystories_v2
  train_files: []
data:
  sources:
  - /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_10/corpus.txt
  format: txt
  doc_separator: <|endoftext|>
  out_dir: /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_10/tokenized
  val_fraction: 0.01
  test_fraction: 0.01
  min_chars: 20
  max_chars: 20000
  dedup: false
  seed: 20260927
train:
  seed: 1338
  device: auto
  precision: fp32
  max_steps: 6000
  batch_size: 1
  grad_accum: 16
  eval_batch_size: 4
  lr: 0.0008
  min_lr_ratio: 0.1
  warmup_steps: 150
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 50
  log_interval: 25
  ckpt_interval: 500
  keep_last: 2
