# Second seed of baseline/freq_1, paired with freq_0_seed1338.yaml -- together these give a real, same-seed-pair
# lift measurement (seed1338 freq_0 -> seed1338 freq_1) directly comparable to the original seed20260927 pair, to
# find out whether the small lift observed at frequency 1 in the original pair is reproducible or was itself noise.
# Only train.seed differs from freq_1.yaml (20260927 -> 1338); data.seed (corpus + canary insertion) unchanged.
name: baseline_freq1_seed1338
description: 'Second seed of frequency 1, paired with freq_0_seed1338 for a real lift-vs-noise comparison.'
model_preset: small
model_overrides: {}
tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: /Users/aaravkhanal/Desktop/myllm/aarav-lm/artifacts/tokenizer_tinystories_v2
  train_files: []
data:
  sources:
  - /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_1/corpus.txt
  format: txt
  doc_separator: <|endoftext|>
  out_dir: /Users/aaravkhanal/Desktop/myllm/canary-memorization-study/data/processed/freq_1/tokenized
  val_fraction: 0.01
  test_fraction: 0.01
  min_chars: 20
  max_chars: 20000
  dedup: false
  seed: 20260927
train:
  seed: 1338
  device: auto
  precision: fp32
  max_steps: 6000
  batch_size: 1
  grad_accum: 16
  eval_batch_size: 4
  lr: 0.0008
  min_lr_ratio: 0.1
  warmup_steps: 150
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 50
  log_interval: 25
  ckpt_interval: 500
  keep_last: 2
